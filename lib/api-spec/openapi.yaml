openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Gəncə Bərəkət Universiteti Forum API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Session authentication endpoints.
  - name: categories
    description: Forum categories
  - name: posts
    description: Forum posts / topics
  - name: replies
    description: Replies to posts
  - name: stats
    description: Forum statistics
  - name: admin
    description: Admin management endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /logout:
    post:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: End the current session (POST so it cannot be triggered cross-site)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '204':
          description: Session cleared.

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all forum categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [admin]
      summary: Create a new category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "403":
          description: Forbidden

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a single category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    put:
      operationId: updateCategory
      tags: [admin]
      summary: Update a category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteCategory
      tags: [admin]
      summary: Delete a category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List posts, optionally filtered by category
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a new post (anonymous)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Validation error

  /posts/recent:
    get:
      operationId: listRecentPosts
      tags: [posts]
      summary: List recent posts across all categories
      responses:
        "200":
          description: Recent posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a post by ID (increments view count)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Update a post (author may edit title/content; only admins may pin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post (its author or an admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /posts/{id}/replies:
    get:
      operationId: listReplies
      tags: [replies]
      summary: List replies for a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Replies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reply"
    post:
      operationId: createReply
      tags: [replies]
      summary: Add a reply to a post (signed-in users)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyInput"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reply"
        "400":
          description: Validation error
        "404":
          description: Post not found

  /replies/{id}:
    patch:
      operationId: updateReply
      tags: [replies]
      summary: Edit a reply (its author or an admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reply"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteReply
      tags: [replies]
      summary: Delete a reply (its author or an admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get overall forum statistics
      responses:
        "200":
          description: Forum stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumStats"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all registered users (admin only)
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden

  /admin/users/{id}/toggle-admin:
    post:
      operationId: toggleAdminUser
      tags: [admin]
      summary: Toggle admin status for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
        "404":
          description: Not found

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, isAdmin, username, displayName, isBanned]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        isAdmin:
          type: boolean
        username:
          type: [string, 'null']
        displayName:
          type: [string, 'null']
        isBanned:
          type: boolean
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Category:
      type: object
      required: [id, name, description, slug, postCount]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        slug:
          type: string
        postCount:
          type: integer
        icon:
          type: ["string", "null"]

    CategoryInput:
      type: object
      required: [name, description, slug]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 300
        slug:
          type: string
          minLength: 2
          maxLength: 100
        icon:
          type: string

    Post:
      type: object
      required: [id, categoryId, categoryName, title, content, authorName, createdAt, replyCount, viewCount, isPinned]
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        categoryName:
          type: string
        title:
          type: string
        content:
          type: string
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
        replyCount:
          type: integer
        viewCount:
          type: integer
        isPinned:
          type: boolean
        lastReplyAt:
          type: ["string", "null"]
        authorId:
          description: Id of the author's account (null if the account was deleted).
          type: ["string", "null"]
        editedAt:
          description: Set when the author or an admin edited the title/content.
          type: ["string", "null"]

    PostList:
      type: object
      required: [posts, total, page, limit]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    PostInput:
      type: object
      required: [categoryId, title, content]
      properties:
        categoryId:
          type: integer
        title:
          type: string
          minLength: 3
          maxLength: 200
        content:
          type: string
          minLength: 10
          maxLength: 20000
        authorName:
          description: Ignored — topics are signed with the account's username.
          type: string
          maxLength: 50

    PostPatch:
      type: object
      properties:
        isPinned:
          description: Admins only.
          type: boolean
        title:
          type: string
          minLength: 3
          maxLength: 200
        content:
          type: string
          minLength: 10
          maxLength: 20000

    Reply:
      type: object
      required: [id, postId, content, authorName, createdAt]
      properties:
        id:
          type: integer
        postId:
          type: integer
        content:
          type: string
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
        authorId:
          description: Id of the author's account (null if the account was deleted).
          type: ["string", "null"]
        editedAt:
          type: ["string", "null"]

    ReplyInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 2
          maxLength: 5000
        authorName:
          description: Ignored — replies are signed with the account's username.
          type: string
          maxLength: 50

    ReplyPatch:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 2
          maxLength: 5000

    ForumStats:
      type: object
      required: [totalPosts, totalReplies, totalCategories, activeToday]
      properties:
        totalPosts:
          type: integer
        totalReplies:
          type: integer
        totalCategories:
          type: integer
        activeToday:
          type: integer

    AdminUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, isAdmin, isBanned, username, displayName, createdAt]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        isAdmin:
          type: boolean
        isBanned:
          type: boolean
        username:
          type: [string, 'null']
        displayName:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
